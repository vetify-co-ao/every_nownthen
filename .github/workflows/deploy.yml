name: Kubernetes CI/CD

on:
  push:
    tags: ["*"]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Test iXLSX
        run: |
          cd scripts/ixlsx
          uv run --with pytest --with requests --with openpyxl \
            --with google-api-python-client --with google-auth \
            --with google-auth-httplib2 -m pytest -q

      - name: Test RC reports
        run: |
          cd scripts/rc_reports
          uv run --with pytest --with requests --with openpyxl \
            --with google-api-python-client --with google-auth \
            --with google-auth-httplib2 -m pytest -q

      - name: Create tag
        run: |
          export TAG=$(date +%s)
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/vetify-every-nownthen:$TAG" >> $GITHUB_ENV
          echo "HOME=/tmp" >> $GITHUB_ENV

      - name: Build container image
        run: docker build -f Dockerfile -t "$IMAGE" .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Push image to repository
        run: docker push $IMAGE

      - name: Update deployment file with image
        run: sed -i "s|<IMAGE>|$IMAGE|" $GITHUB_WORKSPACE/.deployments/k8s/deployment.yaml

      - name: Save DigitalOcean kubeconfig with short-lived credentials
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 ${{ vars.DIGITALOCEAN_K8S_CLUSTER_NAME }}

      - name: Deploy to DigitalOcean Kubernetes
        run: kubectl apply -f $GITHUB_WORKSPACE/.deployments/k8s/deployment.yaml

      - name: Verify deployment
        run: kubectl -n vetify rollout status deployment/every-nownthen

      - name: Verify iXLSX in the deployed pod
        run: |
          POD=$(kubectl -n vetify get pod -l app=every-nownthen -o jsonpath='{.items[0].metadata.name}')
          kubectl -n vetify exec "$POD" -- sh -lc \
            '. /etc/environment; cd /app/scripts/ixlsx && uv run ixlsx.py --dry-run'

      - name: Remove legacy credential ConfigMaps
        run: |
          kubectl -n vetify delete configmap \
            every-nownthen-env-config \
            every-nownthen-service-account-key-path-config \
            --ignore-not-found
